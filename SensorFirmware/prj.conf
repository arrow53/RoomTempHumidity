# nRF Connect SDK v3.2.1 / sdk-zephyr ncs-v3.2.1.
CONFIG_OPENTHREAD=y
CONFIG_OPENTHREAD_SOURCES=y
CONFIG_OPENTHREAD_FTD=y
CONFIG_OPENTHREAD_THREAD_VERSION_1_3=y
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_OPERATIONAL_DATASET_AUTO_INIT=n
CONFIG_OPENTHREAD_NETWORKKEY=""
CONFIG_OPENTHREAD_JOINER=y
CONFIG_OPENTHREAD_JOINER_AUTOSTART=n
CONFIG_OPENTHREAD_COAP=y
# Obtain an address from the border router's advertised OMR/on-mesh prefix.
CONFIG_OPENTHREAD_SLAAC=y
CONFIG_OPENTHREAD_SETTINGS_RAM=n
CONFIG_OPENTHREAD_NRF_SECURITY_PSA_CHOICE=y

CONFIG_SHELL=y
CONFIG_OPENTHREAD_SHELL=y
CONFIG_SHELL_ARGC_MAX=26
CONFIG_SHELL_CMD_BUFF_SIZE=416
# Do not retain commissioning commands in shell history.
CONFIG_SHELL_HISTORY=n

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
# Match Nordic's RRAM-backed nRF54L15 settings backend.
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x8000

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SHT4X=y
CONFIG_HWINFO=y
# Use the real entropy-backed CSPRNG for the public per-boot 128-bit ID.
CONFIG_HARDWARE_DEVICE_CS_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=n
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LOG_DEFAULT_LEVEL=3
